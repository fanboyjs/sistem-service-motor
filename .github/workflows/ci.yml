name: CI/CD

on:
  pull_request:
    branches: [main, test]
  push:
    branches: [main, test]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  migrate-testing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi secret NEON_TESTING_URL
        env:
          URL: ${{ secrets.NEON_TESTING_URL }}
        run: |
          test -n "$URL" || { echo "::error::Secret NEON_TESTING_URL belum di-set di Settings > Secrets > Actions"; exit 1; }
      - name: Install golang-migrate
        run: |
          curl -sL https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/
      - name: Migrate branch testing
        env:
          NEON_URL: ${{ secrets.NEON_TESTING_URL }}
        run: migrate -path migrations -database "$NEON_URL" -verbose up

  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi secret NEON_PRODUCTION_URL
        env:
          URL: ${{ secrets.NEON_PRODUCTION_URL }}
        run: |
          test -n "$URL" || { echo "::error::Secret NEON_PRODUCTION_URL belum di-set di Settings > Secrets > Actions"; exit 1; }
      - name: Install golang-migrate
        run: |
          curl -sL https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/
      - name: Migrate branch production
        env:
          NEON_URL: ${{ secrets.NEON_PRODUCTION_URL }}
        run: migrate -path migrations -database "$NEON_URL" -verbose up

  deploy-railway:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, migrate-production]
    runs-on: ubuntu-latest
    concurrency:
      group: railway-deploy
      cancel-in-progress: false
    container: ghcr.io/railwayapp/cli:latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi secret RAILWAY_TOKEN
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "::error::Secret RAILWAY_TOKEN belum di-set di Settings > Secrets > Actions"; exit 1; }
      - name: Build dan deploy ke Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service=api --detach
