name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  migrate-testing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate branch testing
        run: |
          docker run --rm \
            -v "$PWD/migrations:/migrations" \
            migrate/migrate:v4 \
            -path /migrations \
            -database "${{ secrets.NEON_TESTING_URL }}" \
            up

  migrate-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate branch production
        run: |
          docker run --rm \
            -v "$PWD/migrations:/migrations" \
            migrate/migrate:v4 \
            -path /migrations \
            -database "${{ secrets.NEON_PRODUCTION_URL }}" \
            up

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, migrate-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build binary linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o server ./cmd/api
      - name: Copy binary ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'server'
          target: '/home/${{ secrets.VPS_USER }}/apps/sistem-service-motor'
      - name: Deploy & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/apps/sistem-service-motor
            printf 'APP_ENV=production\nAPP_PORT=8080\nDATABASE_URL=%s\n' "${{ secrets.VPS_DATABASE_URL }}" > .env
            chmod +x server
            sudo systemctl restart sistem-service-motor
