name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  migrate-testing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi secret NEON_TESTING_URL
        env:
          URL: ${{ secrets.NEON_TESTING_URL }}
        run: |
          test -n "$URL" || { echo "::error::Secret NEON_TESTING_URL belum di-set di Settings > Secrets > Actions"; exit 1; }
      - name: Install golang-migrate
        run: |
          curl -sL https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/
      - name: Migrate branch testing
        env:
          NEON_URL: ${{ secrets.NEON_TESTING_URL }}
        run: migrate -path migrations -database "$NEON_URL" -verbose up

  migrate-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi secret NEON_PRODUCTION_URL
        env:
          URL: ${{ secrets.NEON_PRODUCTION_URL }}
        run: |
          test -n "$URL" || { echo "::error::Secret NEON_PRODUCTION_URL belum di-set di Settings > Secrets > Actions"; exit 1; }
      - name: Install golang-migrate
        run: |
          curl -sL https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/
      - name: Migrate branch production
        env:
          NEON_URL: ${{ secrets.NEON_PRODUCTION_URL }}
        run: migrate -path migrations -database "$NEON_URL" -verbose up

  check-deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, migrate-production]
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Cek konfigurasi VPS
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DATABASE_URL: ${{ secrets.VPS_DATABASE_URL }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ] && [ -n "$VPS_DATABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "VPS terkonfigurasi, deploy akan dijalankan."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret VPS belum lengkap, job deploy dilewati."
          fi

  deploy:
    if: needs.check-deploy.outputs.ready == 'true'
    needs: [check-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build binary linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o server ./cmd/api
      - name: Copy binary ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'server'
          target: '/home/${{ secrets.VPS_USER }}/apps/sistem-service-motor'
      - name: Deploy & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/apps/sistem-service-motor
            printf 'APP_ENV=production\nAPP_PORT=8080\nDATABASE_URL=%s\n' "${{ secrets.VPS_DATABASE_URL }}" > .env
            chmod +x server
            sudo systemctl restart sistem-service-motor
