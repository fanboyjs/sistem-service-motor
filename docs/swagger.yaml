basePath: /api
definitions:
  example_com_my-api_internal_dto.CreateServiceItemRequest:
    properties:
      cost:
        type: number
      name:
        maxLength: 150
        minLength: 1
        type: string
      notes:
        type: string
      quantity:
        minimum: 1
        type: integer
      service_record_id:
        type: integer
    required:
    - cost
    - name
    - notes
    - quantity
    - service_record_id
    type: object
  example_com_my-api_internal_dto.CreateServiceRecordRequest:
    properties:
      labor_cost:
        minimum: 0
        type: number
      notes:
        type: string
      odometer:
        minimum: 0
        type: number
      parts_cost:
        minimum: 0
        type: number
      service_date:
        type: string
      service_type_id:
        type: integer
      vehicle_id:
        type: integer
      workshop_name:
        maxLength: 150
        minLength: 1
        type: string
    required:
    - labor_cost
    - notes
    - odometer
    - parts_cost
    - service_date
    - service_type_id
    - vehicle_id
    - workshop_name
    type: object
  example_com_my-api_internal_dto.CreateServiceTypeRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  example_com_my-api_internal_dto.CreateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
      phone:
        maxLength: 20
        type: string
    required:
    - email
    - name
    type: object
  example_com_my-api_internal_dto.CreateVehicleModelRequest:
    properties:
      brand_id:
        type: integer
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - brand_id
    - name
    type: object
  example_com_my-api_internal_dto.CreateVehicleTaxRequest:
    properties:
      due_date:
        type: string
      notes:
        type: string
      other_amount:
        minimum: 0
        type: number
      payment_date:
        type: string
      pkb_amount:
        minimum: 0
        type: number
      status:
        enum:
        - paid
        - unpaid
        type: string
      swdkllj_amount:
        minimum: 0
        type: number
      tax_year:
        maximum: 2100
        type: integer
      vehicle_id:
        type: integer
    required:
    - due_date
    - other_amount
    - payment_date
    - pkb_amount
    - swdkllj_amount
    - tax_year
    - vehicle_id
    type: object
  example_com_my-api_internal_dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  example_com_my-api_internal_dto.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  example_com_my-api_internal_dto.UpdateServiceItemRequest:
    properties:
      cost:
        type: number
      name:
        maxLength: 150
        minLength: 1
        type: string
      notes:
        type: string
      quantity:
        minimum: 1
        type: integer
      service_record_id:
        type: integer
    required:
    - cost
    - name
    - notes
    - quantity
    - service_record_id
    type: object
  example_com_my-api_internal_dto.UpdateServiceRecordRequest:
    properties:
      labor_cost:
        minimum: 0
        type: number
      notes:
        type: string
      odometer:
        minimum: 0
        type: number
      parts_cost:
        minimum: 0
        type: number
      service_date:
        type: string
      service_type_id:
        type: integer
      vehicle_id:
        type: integer
      workshop_name:
        maxLength: 150
        minLength: 1
        type: string
    required:
    - labor_cost
    - notes
    - odometer
    - parts_cost
    - service_date
    - service_type_id
    - vehicle_id
    - workshop_name
    type: object
  example_com_my-api_internal_dto.UpdateServiceTypeRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  example_com_my-api_internal_dto.UpdateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
      phone:
        maxLength: 20
        type: string
    required:
    - email
    - name
    type: object
  example_com_my-api_internal_dto.UpdateVehicleModelRequest:
    properties:
      brand_id:
        type: integer
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - brand_id
    - name
    type: object
  example_com_my-api_internal_dto.UpdateVehicleTaxRequest:
    properties:
      due_date:
        type: string
      notes:
        type: string
      other_amount:
        minimum: 0
        type: number
      payment_date:
        type: string
      pkb_amount:
        minimum: 0
        type: number
      status:
        enum:
        - paid
        - unpaid
        type: string
      swdkllj_amount:
        minimum: 0
        type: number
      tax_year:
        maximum: 2100
        type: integer
      vehicle_id:
        type: integer
    required:
    - due_date
    - other_amount
    - payment_date
    - pkb_amount
    - swdkllj_amount
    - tax_year
    - vehicle_id
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend API untuk sistem service motor. Sebagian besar endpoint membutuhkan
    token JWT (Bearer) yang diperoleh dari login/register.
  title: Sistem Service Motor API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Login dengan email dan password untuk mendapatkan token JWT
      parameters:
      - description: Data login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/example_com_my-api_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: login berhasil
          schema:
            additionalProperties: true
            type: object
        "400":
          description: request body tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: kredensial tidak valid
          schema:
            additionalProperties: true
            type: object
      summary: Login pengguna
      tags:
      - Auth
  /register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan akun baru dan mengembalikan token JWT
      parameters:
      - description: Data registrasi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/example_com_my-api_internal_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: register berhasil
          schema:
            additionalProperties: true
            type: object
        "400":
          description: request body tidak valid
          schema:
            additionalProperties: true
            type: object
        "409":
          description: email sudah terdaftar
          schema:
            additionalProperties: true
            type: object
      summary: Register pengguna baru
      tags:
      - Auth
  /service-items:
    get:
      consumes:
      - application/json
      description: Mengambil daftar semua item servis
      produces:
      - application/json
      responses:
        "200":
          description: Data item servis berhasil diambil
          schema:
            additionalProperties: true
            type: object
        "401":
          description: token tidak valid
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ambil semua item servis
      tags:
      - Service Item
    post:
      consumes:
      - application/json
      description: Membuat data item servis baru
      parameters:
      - description: Data item servis
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/example_com_my-api_internal_dto.CreateServiceItemRequest'
