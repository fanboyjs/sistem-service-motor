            additionalProperties: true
            type: object
        "401":
          description: token tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: record servis tidak ditemukan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Buat item servis
      tags:
      - Service Item
  /service-items/{id}:
    get:
      consumes:
      - application/json
      description: Mengambil data item servis berdasarkan ID
      parameters:
      - description: ID item servis
        in: path
        name: id
        required: true
        type: integer
      produces:
