          description: berhasil hapus data record servis
          schema:
            additionalProperties: true
            type: object
        "400":
          description: id tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: token tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: record servis tidak ditemukan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
