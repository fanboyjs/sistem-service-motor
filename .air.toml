root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  include_ext = ["go", "env"]
  exclude_dir = ["tmp", "bin", "vendor", ".git", ".idea", ".github"]
  exclude_regex = ["_test\\.go"]
  delay = 1000
  stop_on_error = true

[build.windows]
  cmd = "go build -o ./tmp/main.exe ./cmd/api"
  bin = "tmp\\main.exe"
  entrypoint = ["tmp\\main.exe"]

[log]
  time = true

[misc]
  clean_on_exit = true
